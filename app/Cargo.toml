[workspace]

[package]
name = "dossier-app"
version = "0.11.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "The Dossier render client, with a face"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "stream"] }

dossier-produce = { path = "../crates/dossier-produce" }
dossier-beatmap = { path = "../crates/dossier-beatmap" }
dossier-replay = { path = "../crates/dossier-replay" }
dossier-render = { path = "../crates/dossier-render" }
dossier-sim = { path = "../crates/dossier-sim" }
dossier-audio = { path = "../crates/dossier-audio" }

[dev-dependencies]
zip = { version = "2", default-features = false, features = ["deflate"] }
