<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Commissioner:wght@400;500;600&family=JetBrains+Mono:wght@400;700&display=swap');
    body { margin: 0; background: #070304; color: #ece7e2; font-family: Commissioner, "Helvetica Neue", Arial, sans-serif; font-size: 14px; line-height: 20px; -webkit-font-smoothing: antialiased; }
    .win { position: relative; overflow: hidden; background: #070304; }
    .win > img.frame { display: block; width: 100%; height: 100%; }
    .mono { font-family: "JetBrains Mono", ui-monospace, Menlo, monospace; }
    .veil { position: absolute; inset: 0; background: rgba(7,3,4,0.72); }
    .card { position: absolute; border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; background: rgba(28,14,18,0.96); box-shadow: 0 18px 44px rgba(0,0,0,0.5); box-sizing: border-box; }
    .line { display: flex; align-items: center; gap: 10px; height: 24px; font-family: "JetBrains Mono", ui-monospace, Menlo, monospace; font-size: 13px; }
    .line .d { color: #6b655f; }
    .line.now b { color: #ece7e2; }
    .line.bad { color: #e24848; }
    .line.bad .d { color: #e24848; }
    .line.done { color: #a9a29b; }
    .line.todo { color: #6b655f; }
    .g { display: inline-block; width: 12px; text-align: center; }
    .btn { display: inline-flex; align-items: center; height: 32px; padding: 0 12px; border-radius: 8px; font-weight: 600; font-size: 14px; box-sizing: border-box; }
    .btn.primary { background: #e24848; color: #fff; }
    .btn.quiet { color: #a9a29b; }
    .btn.soft { background: rgba(226,72,72,0.10); border: 1px solid rgba(226,72,72,0.18); color: #ece7e2; position: relative; overflow: hidden; }
    .btn.soft i { position: absolute; left: 6px; bottom: 1px; height: 2px; border-radius: 1px; background: #e24848; }
    .cap { color: #a9a29b; font-size: 12px; line-height: 16px; }
    .faint { color: #6b655f; }
    .toast { position: absolute; left: 40px; width: 380px; padding: 12px 14px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.08); background: rgba(20,9,12,0.96); box-shadow: 0 14px 36px rgba(0,0,0,0.5); box-sizing: border-box; }
    .toast .h { display: flex; align-items: center; gap: 8px; font-weight: 600; }
    .toast .h .x { color: #e24848; font-family: "JetBrains Mono", ui-monospace, Menlo, monospace; font-weight: 700; }
    .toast .b { margin-top: 3px; color: #a9a29b; font-size: 12px; line-height: 16px; }
    .toast .b a { color: #e24848; text-decoration: none; }
    .mark { position: absolute; top: 34px; right: 40px; width: 8px; height: 8px; border-radius: 50%; background: #6b655f; }
    .mark.hot { background: #e24848; box-shadow: 0 0 0 4px rgba(226,72,72,0.18); }
    .panel { position: absolute; top: 60px; right: 40px; width: 380px; padding: 18px 20px 16px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.08); background: rgba(20,9,12,0.97); box-shadow: 0 24px 60px rgba(0,0,0,0.55); box-sizing: border-box; }
    .panel h3 { margin: 0 0 8px; font-size: 11px; line-height: 14px; letter-spacing: 0.08em; text-transform: uppercase; color: #6b655f; font-family: "JetBrains Mono", ui-monospace, Menlo, monospace; font-weight: 400; }
    .panel .sec { margin-top: 14px; }
    .panel .sec:first-child { margin-top: 0; }
    .panel .who { display: flex; align-items: center; gap: 10px; }
    .panel .ava { width: 28px; height: 28px; border-radius: 50%; background: linear-gradient(135deg, #3a1015, #e24848); flex: none; }
    .panel .n { color: #6b655f; font-family: "JetBrains Mono", ui-monospace, Menlo, monospace; font-size: 11px; }
    .drawer { position: absolute; top: 0; right: 0; bottom: 0; width: 360px; padding: 26px 28px; border-left: 1px solid rgba(255,255,255,0.08); background: rgba(14,6,9,0.97); box-shadow: -24px 0 60px rgba(0,0,0,0.5); box-sizing: border-box; }
    .drawer h2 { margin: 0 0 18px; font-size: 16px; font-weight: 600; }
    .row2 { display: flex; align-items: center; gap: 10px; }
    .bar { height: 2px; border-radius: 1px; background: rgba(255,255,255,0.08); position: relative; margin-top: 6px; }
    .bar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 1px; background: #e24848; }
    .under { position: absolute; left: 40px; width: 400px; }
    .stripe { position: absolute; left: 0; right: 0; top: 76px; height: 28px; display: flex; align-items: center; gap: 22px; padding: 0 40px; font-size: 12px; color: #a9a29b; background: rgba(7,3,4,0.6); border-bottom: 1px solid rgba(255,255,255,0.06); }
    .stripe b { color: #ece7e2; font-weight: 600; }
    .note { position: absolute; left: 40px; right: 40px; font-size: 12px; line-height: 16px; color: #a9a29b; }
    .kbd { display: inline-block; padding: 0 5px; border-radius: 4px; border: 1px solid rgba(255,255,255,0.14); font-family: "JetBrains Mono", ui-monospace, Menlo, monospace; font-size: 11px; color: #a9a29b; }
  </style>
</helmet>
<div class="win" style="width: 980px; height: 720px;">
<img class="frame" src="main-hover-en-US-980.jpg">
</div>
</x-dc>
</body>
</html>
