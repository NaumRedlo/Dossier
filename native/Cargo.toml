[workspace]

[package]
name = "dossier-native"
version = "0.89.4"
edition = "2021"
license = "AGPL-3.0-only"
description = "The Dossier desktop application"

[[bin]]
name = "dossier"
path = "src/main.rs"

[dependencies]
iced = { version = "0.14", default-features = false, features = ["wgpu", "tiny-skia", "canvas", "image", "svg", "tokio", "advanced"] }
fluent-bundle = "0.16"
unic-langid = { version = "0.9", features = ["macros"] }
sys-locale = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
qrcode = { version = "0.14", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
open = "5"
trash = "5"
cpal = "0.16"
iced_test = "0.14"
png = "0.17"
zip = { version = "2", default-features = false, features = ["deflate"] }
md-5 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
dossier-replay = { path = "../crates/dossier-replay" }
dossier-beatmap = { path = "../crates/dossier-beatmap" }
dossier-sim = { path = "../crates/dossier-sim" }
dossier-render = { path = "../crates/dossier-render" }
dossier-audio = { path = "../crates/dossier-audio" }
dossier-produce = { path = "../crates/dossier-produce" }
dossier-assay = { path = "../crates/dossier-assay" }


[dev-dependencies]
naga = { version = "27", features = ["wgsl-in"] }
rqrr = "0.11"
