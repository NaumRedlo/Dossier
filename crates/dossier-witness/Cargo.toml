[package]
name = "dossier-witness"
description = "Witness: reads what a running osu! client holds in memory, and writes nothing"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
lzma-rs.workspace = true
dossier-overlay = { path = "../dossier-overlay" }

[dev-dependencies]
dossier-replay = { path = "../dossier-replay" }

[lib]
name = "dossier_witness"
path = "src/lib.rs"

[[bin]]
name = "witness"
path = "src/main.rs"
