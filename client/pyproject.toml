[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dossier"
version = "0.1.0"
description = "The Python bridge to Dossier, an osu! replay engine"
readme = "README.md"
license = { text = "AGPL-3.0-only" }
requires-python = ">=3.10"
dependencies = [
    # The render client's HTTP: claiming jobs, heartbeats, uploading the video.
    "aiohttp>=3.9",
    # Fetching maps — a mirror for the archive, osu! itself for the `.osu`.
    "requests>=2.31",
]

[project.urls]
Homepage = "https://github.com/NaumRedlo/Dossier"

# Two packages and no more. `worker.py` sits beside them rather than inside:
# it is a program, not part of the library, and a checkout should be able to
# run it with nothing installed.
[tool.setuptools]
packages = ["dossier", "dossier.osu"]
