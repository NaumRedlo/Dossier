[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dossier"
version = "0.11.0"
description = "The Python bridge to Dossier, an osu! replay engine"
readme = "README.md"
license = { text = "AGPL-3.0-only" }
requires-python = ">=3.10"
dependencies = [

    "aiohttp>=3.9",

    "requests>=2.31",

    "certifi",
]

[project.scripts]
dossier-worker = "dossier.worker:run"

[project.urls]
Homepage = "https://github.com/NaumRedlo/Dossier"

[tool.setuptools]
packages = ["dossier", "dossier.osu"]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",

    "ruff~=0.15.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

asyncio_mode = "auto"
