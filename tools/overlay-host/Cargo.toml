[package]
name = "dossier-overlay-host"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "AGPL-3.0-only"

[workspace]

[dependencies]
dossier-overlay = { path = "../../crates/dossier-overlay" }
dossier-hud = { path = "../../crates/dossier-hud" }

[target.'cfg(windows)'.dependencies]
anyhow = "1"
tokio = { version = "1", features = ["rt", "macros", "time", "signal"] }
asdf-overlay-client = { git = "https://github.com/storycraft/asdf-overlay", rev = "c057c2a4b469d8079dbce39f41fdfeedf5060f86" }
asdf-overlay-surface-util = { git = "https://github.com/storycraft/asdf-overlay", rev = "c057c2a4b469d8079dbce39f41fdfeedf5060f86", default-features = false }
windows = { version = "0.62", features = ["Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common"] }
