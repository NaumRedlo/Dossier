<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Dossier</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
  <header>
    <img class="mark" src="mark.png" alt="" width="38" height="38">
    <div>
      <h1>Dossier</h1>
      <p>Рисует чужие реплеи, пока эта машина свободна.</p>
    </div>
  </header>

  <nav>
    <button id="tab-ready" role="tab" aria-selected="true">Готовность</button>
    <button id="tab-machine" role="tab" aria-selected="false">Машина</button>
  </nav>

  <main>
    <section id="view-ready">
      <div class="card" id="ready-rows"></div>
      <p class="verdict" id="ready-verdict"></p>
      <button class="act" id="again">Спросить заново</button>
    </section>

    <section id="view-machine" hidden>
      <div class="headline" id="machine-headline"></div>
      <div class="card" id="machine-rows"></div>
      <button class="act" id="measure">Измерить заново</button>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
