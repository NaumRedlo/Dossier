[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dossier"
version = "0.1.0"
description = "The Python bridge to Dossier, an osu! replay engine"
readme = "README.md"
license = { text = "AGPL-3.0-only" }
requires-python = ">=3.10"
dependencies = [
    # The render client's HTTP: claiming jobs, heartbeats, uploading the video.
    "aiohttp>=3.9",
    # Fetching maps — a mirror for the archive, osu! itself for the `.osu`.
    "requests>=2.31",
]

# Installed, the client is a command. `python -m dossier.worker` works too, and
# `python client/worker.py` works from a checkout with nothing installed at all
# — three ways in, because the people running this did not all arrive the same
# way.
[project.scripts]
dossier-worker = "dossier.worker:run"

[project.urls]
Homepage = "https://github.com/NaumRedlo/Dossier"

# Two packages and no more — the tests are not shipped, and `client/worker.py`
# is a launcher for people running from a checkout rather than something to
# install.
[tool.setuptools]
packages = ["dossier", "dossier.osu"]

# The tests, for anyone changing this and for the workflow that builds a
# release — nothing ships to somebody's laptop that these did not pass.
[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Every test here that touches the engine is async, and marking each one is a
# line of ceremony per test that says nothing.
asyncio_mode = "auto"

[tool.ruff]
# The code is written to about eighty and occasionally runs past it in a table
# or a message; reflowing those would make them worse. E501 is not in ruff's
# default rule set, and it is deliberately not turned on.
target-version = "py310"

[tool.ruff.lint.per-file-ignores]
# `__init__.py` re-exports on demand: `__all__` is built at runtime from
# `_EXPORTS`, and the `if TYPE_CHECKING:` block exists so that editors and type
# checkers still see the real names. Ruff cannot see the connection between the
# two and reports every one of them as an unused import — fourteen complaints
# about the one thing in the file that is on purpose.
"dossier/__init__.py" = ["F401"]
